<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redação</title>
  <link rel="icon" type="image/x-icon" href="image/favicon.png">
  <link rel="stylesheet" href="./style.css">
  
  <!-- Biblioteca externa para geração nativa de PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <!-- Firebase SDKs (Versão Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body>

  <!-- Tela de Autenticação (Login e Registro) -->
  <div class="login-container" id="auth-screen">
    <div class="login-card">
      <button type="button" class="tool-btn" id="login-theme-btn" onclick="toggleTheme()" style="width: 100%; margin-bottom: 15px;">🌙 Modo Escuro</button>
      <h2 id="auth-title">Entrar na Conta</h2>
      
      <div class="input-group">
        <label for="auth-email">E-mail</label>
        <input type="email" id="auth-email" placeholder="seu@email.com">
      </div>

      <div class="input-group">
        <label for="auth-password">Senha</label>
        <input type="password" id="auth-password" placeholder="******">
      </div>

      <button class="btn-login" id="auth-submit-btn" onclick="processarAutenticacao()">Entrar</button>

      <div id="auth-message"></div>

      <div class="auth-toggle-text">
        <span id="auth-toggle-label">Não tem uma conta?</span>
        <a href="javascript:void(0)" onclick="alternarModoAutenticacao()" id="auth-toggle-link">Cadastre-se</a>
      </div>
    </div>
  </div>

  <!-- Conteúdo Principal da Aplicação -->
  <div id="app-content" style="display: none;">
    
    <!-- Barra Lateral (Sidebar) de Histórico -->
    <div class="sidebar">
      <button class="btn-sidebar-new" onclick="novaRedacao()">+ Nova Redação</button>
      <div class="sidebar-title">Recentes</div>
      <div class="history-list" id="history-list"></div>

      <!-- Informações do Usuário e Logout -->
      <div class="user-info">
        <span id="user-display-email"></span>
        <button class="btn-logout" onclick="fazerLogout()">Sair da Conta</button>
      </div>
    </div>

    <div class="main-wrapper">
      <!-- Barra de Ferramentas -->
      <div class="toolbar-container">
        <div class="tool-group">
          <button class="tool-btn" id="theme-btn" onclick="toggleTheme()" title="Alternar Modo Escuro/Claro">🌙 Modo Escuro</button>
          <button class="tool-btn" id="spellcheck-btn" onclick="toggleSpellcheck()" title="Ativar/Desativar Corretor ortográfico">✓ Corretor: ON</button>
        </div>

        <div class="tool-group">
          <button class="tool-btn" onclick="execCmd('bold')" title="Negrito"><b>B</b></button>
          <button class="tool-btn" onclick="execCmd('italic')" title="Itálico"><i>I</i></button>
          <button class="tool-btn" onclick="execCmd('underline')" title="Sublinhado"><u>U</u></button>
          <button class="tool-btn" onclick="execCmd('strikeThrough')" title="Tachado"><s>S</s></button>
          <button class="tool-btn" onclick="inserirTabulacao()" title="Inserir Tabulação (Parágrafo)">⇥ Tab</button>
        </div>

        <div class="tool-group">
          <button class="tool-btn" onclick="execCmd('justifyLeft')" title="Alinhar à Esquerda">←</button>
          <button class="tool-btn" onclick="execCmd('justifyCenter')" title="Centralizar">↔</button>
          <button class="tool-btn" onclick="execCmd('justifyRight')" title="Alinhar à Direita">→</button>
          <button class="tool-btn" onclick="execCmd('justifyFull')" title="Justificar">☰</button>
        </div>

        <div class="tool-group">
          <select class="tool-btn" id="font-size-select" onchange="alterarTamanhoFonte(this.value)">
            <option value="12px">12px</option>
            <option value="14px">14px</option>
            <option value="16px" selected>16px</option>
            <option value="18px">18px</option>
            <option value="20px">20px</option>
            <option value="24px">24px</option>
          </select>
        </div>

        <div class="tool-group">
          <button class="tool-btn" onclick="execCmd('undo')" title="Desfazer">↶</button>
          <button class="tool-btn" onclick="execCmd('redo')" title="Refazer">↷</button>
        </div>

        <div class="tool-group">
          <select id="export-format" class="tool-btn">
            <option value="txt">Formato: .TXT</option>
            <option value="doc">Formato: .DOC (Word)</option>
            <option value="pdf">Formato: .PDF</option>
          </select>
          <button class="tool-btn save-btn" onclick="exportarDocumento()">Salvar Redação</button>
        </div>
      </div>

      <!-- Área de Trabalho -->
      <div class="workspace">
        <div class="paper" id="paper-to-print">
          <div id="tema" class="theme-input" contenteditable="true" spellcheck="true" data-placeholder="Tema da Redação..." oninput="salvarProgresso()"></div>
          <input type="text" id="titulo" class="title-input" placeholder="Título da Redação" spellcheck="true" oninput="salvarProgresso()" />
          
          <div class="editor-wrapper">
            <div class="line-numbers" id="line-numbers"></div>
            <div id="editor" class="essay-editor" contenteditable="true" spellcheck="true" data-placeholder="Escreva sua redação aqui (máximo 30 linhas)..." oninput="aoDigitarNoEditor()"></div>
          </div>
        </div>

        <div class="scratchpad">
          <div class="scratchpad-title">📝 Bloco de Rascunho</div>
          <textarea id="rascunho" class="scratch-textarea" spellcheck="true" placeholder="Use este espaço livre para anotações..." oninput="salvarProgresso()"></textarea>
        </div>
      </div>

      <!-- Barra de Status -->
      <div class="status-bar">
        <span class="auto-save-status" id="save-status">💾 Rascunho salvo</span>
        <div>
          <span id="char-count">Caracteres: 0</span> | 
          <span id="word-count">Palavras: 0</span>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
